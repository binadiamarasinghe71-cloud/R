<h2 class="text-2xl font-bold mb-6">{{ isEditMode ? 'Edit Employee' : 'Add Employee' }}</h2>

<form #employeeForm="ngForm" (ngSubmit)="submitForm()" class="space-y-4 max-w-md">
  <!-- Name Field -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
    <input
      type="text"
      name="name"
      [(ngModel)]="employee.name"
      #name="ngModel"
      required
      class="w-full px-3 py-2 border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
      placeholder="Enter employee name"
    />
    <div *ngIf="name.invalid && name.touched" class="text-red-500 text-xs mt-1">
      Name is required.
    </div>
  </div>

  <!-- Position Field -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Position</label>
    <input
      type="text"
      name="position"
      [(ngModel)]="employee.position"
      #position="ngModel"
      required
      class="w-full px-3 py-2 border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
      placeholder="Enter job position"
    />
    <div *ngIf="position.invalid && position.touched" class="text-red-500 text-xs mt-1">
      Position is required.
    </div>
  </div>

  <!-- Level Select -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Level</label>
    <select
      name="level"
      [(ngModel)]="employee.level"
      required
      class="w-full px-3 py-2 border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
    >
      <option value="junior">Junior</option>
      <option value="mid">Mid</option>
      <option value="senior">Senior</option>
    </select>
  </div>

  <!-- Action Buttons -->
  <div class="flex space-x-3 pt-2">
    <button
      type="submit"
      [disabled]="!employeeForm.form.valid"
      class="px-4 py-2 text-white rounded bg-green-600 hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed transition"
    >
      {{ isEditMode ? 'Update' : 'Create' }}
    </button>
    <a
      routerLink="/"
      class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600 transition inline-block"
    >
      Cancel
    </a>
  </div>
</form>
